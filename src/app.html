<!doctype html>

<html lang="%paraglide.lang%" dir="%paraglide.dir%">
	<head>
		<meta charset="utf-8" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1"
		/>

		<meta name="text-scale" content="scale" />

		<link
			rel="icon"
			type="image/webp"
			href="/creditbird-logo.webp"
		/>

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com"
		/>

		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin
		/>

		<link
			href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>

		<!-- Cloudflare Turnstile Explicit API -->
		<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

		%sveltekit.head%
	</head>

	<body data-sveltekit-preload-data="hover"><div style="display: contents">%sveltekit.body%</div></body>
</html>
